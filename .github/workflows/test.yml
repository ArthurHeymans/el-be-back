name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs: "29.4"
            serial: true
          - emacs: "30.2"
            serial: true
          - emacs: snapshot
            serial: true

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Emacs
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs }}

      - name: Show Emacs version
        run: emacs --version

      - name: Run core tests
        run: emacs -Q --batch -L . -l ebb-test.el -f ert-run-tests-batch-and-exit

      - name: Run serial tests
        if: matrix.serial
        run: emacs -Q --batch -L . -l ebb-serial-test.el -f ert-run-tests-batch-and-exit

      - name: Check out esctest2
        if: matrix.emacs == '30.2'
        run: |
          git clone https://github.com/ThomasDickey/esctest2.git /tmp/esctest2
          git -C /tmp/esctest2 checkout 664be3cf2c1e3f06bc93a8bafb48a0db83c607db

      - name: Run terminal compatibility tests
        if: matrix.emacs == '30.2'
        env:
          EBB_ESCTEST_DIR: /tmp/esctest2
        run: emacs -Q --batch -L . -l test/ebb-esctest.el

  bench:
    name: Benchmark regression
    # Benchmark the PR and its base back to back on the same runner
    # and fail on a >25% slowdown in any case.  Comparing two runs on
    # one machine avoids a checked-in baseline that goes stale with
    # runner hardware.  Stacked PRs compare against their parent
    # branch, which is exactly the change under review.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Emacs
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: "30.2"

      - name: Benchmark pull request
        run: ./bench/run-ebb-bench.sh --out /tmp/head.tsv

      - name: Check out recorded base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA"
          git worktree add --detach /tmp/ebb-base "$BASE_SHA"
          # The base may predate the benchmark harness; run this PR's
          # harness against the base sources.
          cp bench/ebb-bench.el bench/run-ebb-bench.sh bench/compare.py \
            /tmp/ebb-base/bench/

      - name: Benchmark base branch
        run: /tmp/ebb-base/bench/run-ebb-bench.sh --out /tmp/base.tsv

      - name: Compare
        run: python3 bench/compare.py /tmp/base.tsv /tmp/head.tsv --threshold 25
