name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs: "29.4"
            serial: true
          - emacs: "30.2"
            serial: true
          - emacs: snapshot
            serial: true

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Emacs
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs }}

      - name: Show Emacs version
        run: emacs --version

      - name: Run core tests
        run: emacs -Q --batch -L . -l ebb-test.el -f ert-run-tests-batch-and-exit

      - name: Run serial tests
        if: matrix.serial
        run: emacs -Q --batch -L . -l ebb-serial-test.el -f ert-run-tests-batch-and-exit

      - name: Check out esctest2
        if: matrix.emacs == '30.2'
        run: |
          git clone https://github.com/ThomasDickey/esctest2.git /tmp/esctest2
          git -C /tmp/esctest2 checkout 664be3cf2c1e3f06bc93a8bafb48a0db83c607db

      - name: Run terminal compatibility tests
        if: matrix.emacs == '30.2'
        env:
          EBB_ESCTEST_DIR: /tmp/esctest2
        run: emacs -Q --batch -L . -l test/ebb-esctest.el
