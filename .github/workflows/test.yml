name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs: "28.2"
            serial: false
          - emacs: "29.4"
            serial: false
          - emacs: "30.2"
            serial: true
          - emacs: snapshot
            serial: true

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}

      - name: Show Emacs version
        run: emacs --version

      - name: Run core tests
        run: emacs -Q --batch -L . -l ebb-test.el -f ert-run-tests-batch-and-exit

      - name: Run serial tests
        if: matrix.serial
        run: emacs -Q --batch -L . -l ebb-serial-test.el -f ert-run-tests-batch-and-exit
